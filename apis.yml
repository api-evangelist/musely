name: Musely
description: 'Musely is a telehealth platform, founded in 2012 by Jack Jia and Carrie Jiao and based in
  San Jose, California, that connects patients with U.S. board-certified dermatologists for personalized,
  prescription-strength skincare and related care. Patients share skin concerns online, physicians craft
  personalized treatment plans, and freshly compounded formulas are shipped to the patient. Since pivoting
  from a wellness community to prescription skincare in 2019, Musely has expanded into hair loss, hormonal/menopause
  health, and longevity, serving more than 1.2 million patients. Musely is a consumer/health company in
  the API Evangelist network; it operates as a direct-to-consumer web and mobile telehealth experience
  and does not publish a public developer API, SDK, or webhook surface as of this enrichment pass.'
